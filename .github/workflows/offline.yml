name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]' build
      - run: python -m pytest -q
      - run: ruff check .
      - run: python -m compileall -q shrutadhara
      - run: python -m build
      - run: python tools/prepare_npm.py dist/*.whl /tmp/shrutadhara-npm
      - run: npm pack --ignore-scripts --pack-destination dist /tmp/shrutadhara-npm
      - run: python tools/check_release.py dist
