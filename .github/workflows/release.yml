name: Experimental release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  packages:
    uses: ./.github/workflows/packages.yml
  publish:
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Require matching source and npm versions
        run: |
          python - <<'PY'
          import json, os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          assert json.load(open('npm/package.json'))['version'] == version
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-assets"
          merge-multiple: true
          path: dist
      - name: Checksum all validated assets
        run: |
          cd dist
          sha256sum *.whl *.tar.gz *.tgz *.deb *.pkg.tar.zst > SHA256SUMS
      - name: Publish experimental GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "Shrutadhara $GITHUB_REF_NAME — experimental" --notes-file docs/RELEASE_NOTES.md
      - name: Refresh signed APT archive after release publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apt-publish.yml --ref main --field tag="$GITHUB_REF_NAME"
