[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shrutadhara"
version = "0.1.0"
description = "Shrutadhara: a local-first AI meeting assistant with native GTK controls and private PipeWire capture"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["jsonschema>=4.20,<5"]

[project.urls]
Repository = "https://github.com/Praneel7015/shrutadhara"
Issues = "https://github.com/Praneel7015/shrutadhara/issues"
Documentation = "https://github.com/Praneel7015/shrutadhara#readme"

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
shruta = "shrutadhara.cli:main"

[tool.setuptools.packages.find]
include = ["shrutadhara*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.data-files]
"share/applications" = ["desktop/io.github.Praneel7015.Shrutadhara.desktop"]
